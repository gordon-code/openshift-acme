name: Publish images

on:
  push:
    branches: [main]
    tags: ["*"]
    paths-ignore:
      - '**/*.md'
      - 'deploy/**'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Build, test, and lint
    uses: ./.github/workflows/verify.yaml

  publish:
    name: Build and push images to ghcr.io
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push controller image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/openshift-acme-controller/Dockerfile
          push: true
          tags: |
            ghcr.io/gordon-code/openshift-acme-controller:latest
            ghcr.io/gordon-code/openshift-acme-controller:${{ github.sha }}

      - name: Build and push exposer image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/openshift-acme-exposer/Dockerfile
          push: true
          tags: |
            ghcr.io/gordon-code/openshift-acme-exposer:latest
            ghcr.io/gordon-code/openshift-acme-exposer:${{ github.sha }}
