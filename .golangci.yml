version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - unconvert
    - unparam
    - misspell
    - bodyclose
    - contextcheck
  settings:
    staticcheck:
      checks:
        - all
        - "-SA1019"
    govet:
      disable:
        - inline

formatters:
  enable:
    - gofmt
    - goimports
